ansible-playbook -i inventory.ini network-info.yml

 name: Gather network information
  hosts: linux
  become: yes

  tasks:
    - name: Show IP address information
      command: ip addr
      register: ip_output

    - name: Display results
      debug:
        var: ip_output.stdout

        name: Backup Cisco configs
  hosts: switches
  gather_facts: no

  tasks:
    - name: Save running config
      ios_command:
        commands:
          - show running-config
      register: config

    - name: Save output locally
      copy:
        content: "{{ config.stdout[0] }}"
        dest: "./backups/{{ inventory_hostname }}.txt"
